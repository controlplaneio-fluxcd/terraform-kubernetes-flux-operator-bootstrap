job:
  image:
    repository: ghcr.io/controlplaneio-fluxcd/flux-operator-bootstrap
    tag: ""
    pullPolicy: IfNotPresent
  affinity: {}
  tolerations: []
  hostNetwork: false
  env: {}
  # Defaults satisfy Pod Security Standards "restricted".
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

commonMetadata:
  labels: {}
  annotations: {}

gitopsResources:
  instance: ""
  prerequisites:
    manifests: {}
    charts: []
  operatorChart:
    repository: ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: ""
    values: ""

managedResources:
  hasSecrets: false
  secretsHash: ""
  runtimeInfo:
    data: {}
    labels: {}
    annotations: {}

timeout: "10m"

debugFaultInjectionMessage: ""
debugFluxOperatorImageTag: ""

revision: 0
